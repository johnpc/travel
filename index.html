<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Travel — plan the trip your group actually takes</title>
    <meta
      name="description"
      content="Name a trip, share one link, and everyone brainstorms destinations, votes, and finds dates that work — then you book it. No sign-up."
    />

    <!-- Link-unfurl preview (iMessage / WhatsApp / Slack / etc.). A shared trip
         URL is the whole growth loop, so it deserves a rich card, not a bare
         link. App-level (this SPA can't prerender per-trip tags). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Travel" />
    <meta property="og:title" content="Plan the trip your group actually takes" />
    <meta
      property="og:description"
      content="Share one link — everyone brainstorms destinations, votes, and finds dates that work. Then book it. No sign-up."
    />
    <meta property="og:image" content="https://travel.jpc.io/hero.png" />
    <meta property="og:url" content="https://travel.jpc.io/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plan the trip your group actually takes" />
    <meta
      name="twitter:description"
      content="Share one link — everyone brainstorms destinations, votes, and finds dates that work. Then book it."
    />
    <meta name="twitter:image" content="https://travel.jpc.io/hero.png" />

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <!-- Tint the mobile browser chrome to match the app's warm bg (light) and
         charcoal bg (dark) instead of a jarring default-white bar. -->
    <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)" />
    <!-- Allow pinch-zoom for accessibility (WCAG 1.4.4); keep viewport-fit=cover
         so safe-area insets still work under the notch. -->
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="manifest" href="/manifest.json" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <!-- iOS home-screen icon (Add to Home Screen from Safari uses this, not the
         manifest) — the branded pin, so it's not a blank screenshot. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Travel" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
